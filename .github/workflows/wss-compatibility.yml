name: WSS integration compatibility

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  behavioral-tests:
    name: Integration behavioral tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate promotion safety contracts
        shell: pwsh
        run: |
          ./.github/scripts/tests/WssPromotion.Tests.ps1
          ./.github/scripts/tests/WssInventory.Tests.ps1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Clean outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path src, tests -Directory -Recurse -Force |
            Where-Object Name -in @('bin', 'obj') |
            Remove-Item -Recurse -Force

      - name: Restore committed Integration state
        shell: pwsh
        run: dotnet restore tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj

      - name: Build committed Integration state
        shell: pwsh
        run: >-
          dotnet build tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj
          -c Release
          --no-restore
          -p:TreatWarningsAsErrors=true

      - name: Run shared C# implementation behavioral tests
        shell: pwsh
        run: >-
          dotnet test tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj
          -c Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~Wss.CSharpImplementation.Tests.StimulationOptionsTests|FullyQualifiedName~Wss.CSharpImplementation.Tests.StimulationControllerTestModeTests|FullyQualifiedName~Wss.CSharpImplementation.Tests.StimulationControllerConformanceTests"
          -p:TreatWarningsAsErrors=true

  compatibility:
    name: Integration compatibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Clean outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path src, tests -Directory -Recurse -Force |
            Where-Object Name -in @('bin', 'obj') |
            Remove-Item -Recurse -Force

      - name: Restore committed Integration state
        shell: pwsh
        run: dotnet restore tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj

      - name: Build committed Integration state
        shell: pwsh
        run: >-
          dotnet build tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj
          -c Release
          --no-restore
          -p:TreatWarningsAsErrors=true

      - name: Verify committed WSS artifact propagation
        shell: pwsh
        run: |
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot 'lib' -OutputRoot 'tests/Wss.CSharpImplementation.Tests/bin/Release/net9.0'

      - name: Run platform compatibility tests
        shell: pwsh
        run: >-
          dotnet test tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj
          -c Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~Wss.CSharpImplementation.Tests.SerialRuntimeSelectionTests|FullyQualifiedName~Wss.CSharpImplementation.Tests.BleBackendLoadingTests"
          -p:TreatWarningsAsErrors=true

      - name: Check out reviewed Core source for declared macOS fixture
        if: runner.os == 'macOS'
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: 0ac18df22a1371e5ff94d5485c6d3fa4b3e6538f
          path: .macos-ble-fixture-core
          persist-credentials: false

      - name: Verify declared macOS native fixture and fail-closed missing payload
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./.github/scripts/Test-MacBleFixture.ps1 -CoreSourceRoot "$env:GITHUB_WORKSPACE/.macos-ble-fixture-core" -WorkRoot "$env:RUNNER_TEMP/macos-ble-fixture"

      - name: Retain macOS fixture evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-ble-fixture-evidence
          path: |
            ${{ runner.temp }}/macos-ble-fixture/fixture-evidence.json
            ${{ runner.temp }}/macos-ble-fixture/missing-native-rejection.log
            ${{ runner.temp }}/macos-ble-fixture/results/*.trx
          if-no-files-found: warn
