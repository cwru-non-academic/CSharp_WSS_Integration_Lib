name: WSS integration compatibility

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  resolve-channel:
    name: Verified ordinary CI channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind the channel to the actual event and workflow source
        id: channel
        shell: pwsh
        run: ./.github/scripts/Resolve-OrdinaryCiChannel.ps1
      - name: Exercise ordinary channel and workflow contracts
        shell: pwsh
        run: ./.github/scripts/tests/OrdinaryCiChannel.Tests.ps1

  package-contracts:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: Committed universal package contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create producer read token
        id: core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Resolve the exact committed package and compare all committed payload bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          $record = Get-Content lib/wss-candidate.json -Raw | ConvertFrom-Json
          $c = $record.candidate
          ./.github/scripts/Resolve-WssRelease.ps1 -ProducerRepository $c.repository -RunId $c.run_id -ExpectedCommit $c.commit -ArchiveName $c.archive -ExpectedSha256 $c.sha256 -OutputRoot "$env:RUNNER_TEMP/wss-release"
          $resolved = Get-Content "$env:RUNNER_TEMP/wss-release/candidate.json" -Raw | ConvertFrom-Json
          if ($resolved.artifact_id -cne $c.artifact_id) { throw 'Committed artifact identity differs from selected artifact.' }
          . ./.github/scripts/Universal-WssFiles.ps1
          $files = @(Read-WssUniversalFiles 'lib' -AllowProvenance)
          foreach ($file in $files) {
            if ((Get-FileHash -LiteralPath "lib/$file").Hash -cne (Get-FileHash -LiteralPath "$env:RUNNER_TEMP/wss-release/extracted/WSS-Universal/$file").Hash) { throw "Committed package differs: $file" }
          }
      - name: Read reviewed package verifier identity independently of candidate provenance
        id: package-tools
        shell: pwsh
        run: |
          $lock = Get-Content .github/scripts/wss-ci.lock.json -Raw | ConvertFrom-Json
          if ($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cne '3eb48da437841fb705c4e984c839838722e77baf' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)") { throw 'Unexpected reviewed package verifier lock.' }
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.package-tools.outputs.commit }}
          path: workflow-guard
          token: ${{ steps.core-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run unchanged Core package contracts on the full selected universal payload
        shell: pwsh
        run: |
          & dotnet build workflow-guard/tools/ArtifactBuild/ArtifactBuild.csproj -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed ArtifactBuild build failed.' }
          & python workflow-guard/tests/Packaging/verify_universal.py "$env:RUNNER_TEMP/wss-release/extracted/WSS-Universal"
          if ($LASTEXITCODE -ne 0) { throw 'Selected universal package contracts failed.' }

  receipt-policy-boundary:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: Receipt policy bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise canonical policy through the actual PowerShell adapter
        shell: pwsh
        # Dev here is only the synthetic contract fixture, never the execution channel.
        env:
          WSS_CI_CHANNEL: dev
        run: ./.github/scripts/tests/WssReleaseReceipt.Tests.ps1
  behavioral-tests:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: Integration behavioral tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4

      - name: Validate promotion safety contracts
        shell: pwsh
        # Dev here is only the synthetic contract fixture, never the execution channel.
        env:
          WSS_CI_CHANNEL: dev
        run: |
          ./.github/scripts/tests/MacOSBleEvidence.Tests.ps1
          ./.github/scripts/tests/MissingNativeEvidence.Tests.ps1
          ./.github/scripts/tests/WssPromotion.Tests.ps1
          ./.github/scripts/tests/WssInventory.Tests.ps1
          ./.github/scripts/tests/WssReleaseReceipt.Tests.ps1
          ./.github/scripts/tests/WssFanout.Tests.ps1
          ./.github/scripts/tests/WssAcceptance.Tests.ps1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Clean outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path src, tests -Directory -Recurse -Force |
            Where-Object Name -in @('bin', 'obj') |
            Remove-Item -Recurse -Force

      - name: Create profile producer read token
        id: profile-core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Prepare immutable profile test project
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.profile-core-token.outputs.token }}
        run: >-
          ./.github/scripts/Prepare-CSharpProfile.ps1
          -IntegrationRoot .
          -WorkRoot "${{ runner.temp }}/wss-profile"

      - name: Restore committed Integration state
        shell: pwsh
        run: dotnet restore -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false

      - name: Build committed Integration state
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/restored-assets/RestoredAssets.ps1
          $builtProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $buildRestoreProof=New-WssRestoredAssetsProof -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -ProjectPath $env:WSS_PROFILE_PROJECT
          dotnet build -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Cache-disabled build failed.' }
          & "./.github/scripts/Verify-WssOutput.ps1" -ArtifactRoot $builtProfile.payload_root -OutputRoot (Join-Path $builtProfile.output_root 'Release/net9.0') -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -RestoreProof $buildRestoreProof
      - name: Run shared C# implementation behavioral tests
        shell: pwsh
        run: ./.github/scripts/Invoke-WssBehavioralConformance.ps1

  compatibility:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: Integration compatibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Clean outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path src, tests -Directory -Recurse -Force |
            Where-Object Name -in @('bin', 'obj') |
            Remove-Item -Recurse -Force

      - name: Create profile producer read token
        id: profile-core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Prepare immutable profile test project
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.profile-core-token.outputs.token }}
        run: >-
          ./.github/scripts/Prepare-CSharpProfile.ps1
          -IntegrationRoot .
          -WorkRoot "${{ runner.temp }}/wss-profile"

      - name: Restore committed Integration state
        shell: pwsh
        run: dotnet restore -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false

      - name: Build committed Integration state
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/restored-assets/RestoredAssets.ps1
          $builtProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $buildRestoreProof=New-WssRestoredAssetsProof -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -ProjectPath $env:WSS_PROFILE_PROJECT
          dotnet build -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Cache-disabled build failed.' }
          & "./.github/scripts/Verify-WssOutput.ps1" -ArtifactRoot $builtProfile.payload_root -OutputRoot (Join-Path $builtProfile.output_root 'Release/net9.0') -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -RestoreProof $buildRestoreProof
      - name: Verify committed WSS artifact propagation
        shell: pwsh
        run: |
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot 'lib' -OutputRoot 'tests/Wss.CSharpImplementation.Tests/bin/Release/net9.0' -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json')

      - name: Run platform compatibility tests
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/compiled-tests/CompiledCSharpTests.ps1
          $compiledProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $compiledProof=New-CompiledCSharpTestProof -OutputRoot (Join-Path $compiledProfile.output_root 'Release/net9.0') -AssemblyName 'Wss.CSharpImplementation.Tests.dll'
          Invoke-CompiledCSharpTests -Proof $compiledProof -ResultsDirectory (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'TestResults') -Filter "FullyQualifiedName~Wss.CSharpImplementation.Tests.SerialRuntimeSelectionTests|FullyQualifiedName~Wss.CSharpImplementation.Tests.BleBackendLoadingTests" -TrxFileName 'platform.trx'
  macos_architecture:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: macOS BLE detail (${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            label: macOS
            os: macos-15-intel
            arch: x64
            test_platform: x64
            cpu: Intel x86_64
          - name: macOS
            label: macOS
            os: macos-15
            arch: arm64
            test_platform: ARM64
            cpu: Apple Silicon arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify native macOS and dotnet architecture
        shell: pwsh
        env:
          DOTNET_CLI_UI_LANGUAGE: en-US
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Initialize-WssMacOSEvidence '${{ matrix.arch }}' 'wrapper-normal' "$env:RUNNER_TEMP/macos-evidence"
      - name: Clean outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path src, tests -Directory -Recurse -Force |
            Where-Object Name -in @('bin', 'obj') |
            Remove-Item -Recurse -Force

      - name: Create profile producer read token
        id: profile-core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Prepare immutable profile test project
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.profile-core-token.outputs.token }}
        run: >-
          ./.github/scripts/Prepare-CSharpProfile.ps1
          -IntegrationRoot .
          -WorkRoot "${{ runner.temp }}/wss-profile"

      - name: Restore committed Integration state
        shell: pwsh
        run: dotnet restore -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false

      - name: Build committed Integration state
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/restored-assets/RestoredAssets.ps1
          $builtProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $buildRestoreProof=New-WssRestoredAssetsProof -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -ProjectPath $env:WSS_PROFILE_PROJECT
          dotnet build -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Cache-disabled build failed.' }
          & "./.github/scripts/Verify-WssOutput.ps1" -ArtifactRoot $builtProfile.payload_root -OutputRoot (Join-Path $builtProfile.output_root 'Release/net9.0') -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -RestoreProof $buildRestoreProof
      - name: Verify committed WSS artifact propagation
        shell: pwsh
        run: |
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot 'lib' -OutputRoot 'tests/Wss.CSharpImplementation.Tests/bin/Release/net9.0' -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json')

      - name: Run platform compatibility tests
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/compiled-tests/CompiledCSharpTests.ps1
          $compiledProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $compiledProof=New-CompiledCSharpTestProof -OutputRoot (Join-Path $compiledProfile.output_root 'Release/net9.0') -AssemblyName 'Wss.CSharpImplementation.Tests.dll'
          Invoke-CompiledCSharpTests -Proof $compiledProof -ResultsDirectory "$env:RUNNER_TEMP/macos-results" -Filter "FullyQualifiedName~Wss.CSharpImplementation.Tests.SerialRuntimeSelectionTests|FullyQualifiedName~Wss.CSharpImplementation.Tests.BleBackendLoadingTests" -TrxFileName 'macos-platform.trx' -Platform '${{ matrix.test_platform }}' -DetailedConsole | Tee-Object -FilePath "$env:RUNNER_TEMP/macos-platform.log"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical platform tests failed.' }

      - name: Record canonical packaged BLE result before any synthetic fixture
        if: always()
        shell: pwsh
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Write-WssMacOSEvidence '${{ matrix.arch }}' 'wrapper-normal' "$env:RUNNER_TEMP/macos-evidence" "$env:RUNNER_TEMP/macos-results/macos-platform.trx" "$env:RUNNER_TEMP/macos-platform.log" 'tests/Wss.CSharpImplementation.Tests/bin/Release/net9.0'

      - name: Verify selected macOS output rejects missing native payload
        shell: pwsh
        run: ./.github/scripts/Test-MacBleFixture.ps1 -OutputRoot 'tests/Wss.CSharpImplementation.Tests/bin/Release/net9.0' -WorkRoot "$env:RUNNER_TEMP/macos-ble-fixture" -TestPlatform '${{ matrix.test_platform }}'

      - name: Retain macOS fixture evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-ble-fixture-evidence-${{ matrix.arch }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-ble-fixture/fixture-evidence.json
            ${{ runner.temp }}/macos-ble-fixture/missing-native-rejection.log
            ${{ runner.temp }}/macos-ble-fixture/results/*.trx
          if-no-files-found: warn

      - name: Finalize architecture evidence including all worker steps
        if: always()
        shell: pwsh
        env:
          WORKER_RESULT: ${{ job.status }}
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Finalize-WssMacOSEvidence '${{ matrix.arch }}' 'wrapper-normal' "$env:RUNNER_TEMP/macos-evidence" $env:WORKER_RESULT
      - name: Retain architecture-specific canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wss-macos-wrapper-normal-${{ matrix.arch }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-evidence/*.json
            ${{ runner.temp }}/macos-results/*.trx
            ${{ runner.temp }}/macos-platform.log
            ${{ runner.temp }}/macos-cli.log
          if-no-files-found: error

  macos_compatibility:
    name: Integration compatibility (macOS)
    needs: [resolve-channel, macos_architecture]
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful channel resolution
        if: always()
        shell: pwsh
        env:
          CHANNEL_RESULT: ${{ needs.resolve-channel.result }}
        run: |
          if ($env:CHANNEL_RESULT -cne 'success' -or $env:WSS_CI_CHANNEL -cnotin @('dev', 'main')) { throw 'Ordinary channel resolution did not succeed.' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gather both native architecture records
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: wss-macos-wrapper-normal-*-a${{ github.run_attempt }}
          path: macos-evidence
      - name: Require Intel and Apple Silicon success and show failures separately
        if: always()
        shell: pwsh
        env:
          WORKER_RESULT: ${{ needs.macos_architecture.result }}
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Complete-WssMacOSGate 'macos-evidence' 'wrapper-normal' $env:WORKER_RESULT
