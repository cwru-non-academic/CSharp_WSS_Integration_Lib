name: Emit release acceptance receipt
run-name: WSS acceptance csharp-wrapper ${{ inputs.plan_id }}
on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Canonical channel push producer run with frozen plan
        required: true
        type: string
      plan_id:
        description: Exact frozen wss-propagation-plan/v1 digest
        required: true
        type: string
env:
  WSS_CI_CHANNEL: ${{ github.ref_name }}
  WSS_TARGET_ROOT: ${{ github.workspace }}/.accepted
  WSS_CORE_TOOLS_ROOT: ${{ github.workspace }}/workflow-guard
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: acceptance-csharp-wrapper-${{ inputs.plan_id }}
  cancel-in-progress: false
jobs:
  receipt:
    name: Verify actual wrapper merge and exact candidate acceptance
    if: github.repository == 'cwru-non-academic/CSharp_WSS_Integration_Lib' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .tools
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .validation-tools
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .accepted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read locked Core guard source
        id: guard
        shell: pwsh
        run: |
          $lock=Get-Content .accepted/.github/scripts/wss-ci.lock.json -Raw|ConvertFrom-Json
          if($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)"){throw 'Invalid immutable Core guard lock.'}
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - name: Create receipt evidence read token
        id: receipt-evidence
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            CSharp_WSS_Integration_Lib
            CLI_CSharp_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
      - name: Validate provenance, paired preflights, actual merge and fresh normal CI
        id: receipt
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.receipt-evidence.outputs.token }}
          PRODUCER_RUN: ${{ inputs.producer_run_id }}
          PLAN_ID: ${{ inputs.plan_id }}
        run: ./.tools/.github/scripts/Write-ReleaseReceipt.ps1 -TargetId csharp-wrapper -ProducerRunId $env:PRODUCER_RUN -PlanId $env:PLAN_ID
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: receipt-output/receipt.json
          if-no-files-found: error
