name: WSS downloaded-artifact preflight
run-name: WSS preflight ${{ inputs.wss_run_id || inputs.wss_release_tag }} / ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      wss_release_tag:
        description: Published universal release tag (mutually exclusive with run ID)
        required: false
        type: string
      correlation_id:
        description: Optional promotion-cascade correlation ID
        required: false
        type: string
      wss_producer_repository:
        description: Authoritative producer repository
        default: cwru-non-academic/WSSCore
        type: string
      wss_run_id:
        description: Exact successful artifacts.yml run ID (no PR merge-ref artifacts)
        type: string
      wss_commit:
        description: Expected full producer commit SHA
        required: true
        type: string
      wss_archive:
        description: Universal ZIP filename
        default: WSS-Universal-ci.zip
        required: true
        type: string
      wss_sha256:
        description: Expected universal ZIP SHA-256
        required: true
        type: string

env:
  WSS_CI_CHANNEL: ${{ github.ref_name }}
permissions:
  contents: read

jobs:
  resolve-inputs:
    name: Resolve preflight inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
      - name: Create producer read token
        id: core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Resolve and validate inputs
        id: resolve
        shell: pwsh
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          GH_TOKEN: ${{ steps.core-token.outputs.token }}
          PRODUCER_REPOSITORY: ${{ inputs.wss_producer_repository }}
          RUN_ID: ${{ inputs.wss_run_id }}
          EXPECTED_COMMIT: ${{ inputs.wss_commit }}
          ARCHIVE: ${{ inputs.wss_archive }}
          SHA256: ${{ inputs.wss_sha256 }}
          RELEASE_TAG: ${{ inputs.wss_release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CORRELATION_ID.Length -gt 200 -or $env:CORRELATION_ID -match "[\r\n]") {
            throw 'correlation_id must be a single line no longer than 200 characters.'
          }

          ./.github/scripts/Resolve-WssRelease.ps1 -ProducerRepository $env:PRODUCER_REPOSITORY -RunId $env:RUN_ID -ReleaseTag $env:RELEASE_TAG -ExpectedCommit $env:EXPECTED_COMMIT -ArchiveName $env:ARCHIVE -ExpectedSha256 $env:SHA256 -OutputRoot "$env:RUNNER_TEMP/wss-release"
      - name: Read reviewed package verifier identity independently of candidate provenance
        id: package-tools
        shell: pwsh
        run: |
          $lock = Get-Content .github/scripts/wss-ci.lock.json -Raw | ConvertFrom-Json
          if ($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cne '3eb48da437841fb705c4e984c839838722e77baf' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)") { throw 'Unexpected reviewed package verifier lock.' }
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.package-tools.outputs.commit }}
          path: workflow-guard
          token: ${{ steps.core-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run unchanged Core package contracts on the full selected universal payload
        shell: pwsh
        run: |
          & dotnet build workflow-guard/tools/ArtifactBuild/ArtifactBuild.csproj -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed ArtifactBuild build failed.' }
          & python workflow-guard/tests/Packaging/verify_universal.py "$env:RUNNER_TEMP/wss-release/extracted/WSS-Universal"
          if ($LASTEXITCODE -ne 0) { throw 'Selected universal package contracts failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: verified-wss-universal
          path: ${{ runner.temp }}/wss-release/extracted/WSS-Universal
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: wss-candidate-provenance
          path: ${{ runner.temp }}/wss-release/candidate.json
          if-no-files-found: error

  behavioral-tests:
    name: Preflight behavioral tests
    needs: resolve-inputs
    runs-on: ubuntu-latest
    env:
      WSS_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
      WSS_BLE_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/download-artifact@v4
        with:
          name: verified-wss-universal
          path: ${{ env.WSS_ARTIFACT_DIR }}

      - name: Disable committed fallback and clean outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'lib' -PathType Container)) {
            throw 'Committed lib directory is missing.'
          }
          Move-Item -LiteralPath 'lib' -Destination 'lib.preflight-disabled'
          if (Test-Path -LiteralPath 'lib') {
            throw 'Committed lib fallback remains available.'
          }
          Get-ChildItem -Path src, tests -Directory -Recurse -Force |
            Where-Object Name -in @('bin', 'obj') |
            Remove-Item -Recurse -Force

      - name: Create profile producer read token
        id: profile-core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Download verified profile provenance
        uses: actions/download-artifact@v4
        with:
          name: wss-candidate-provenance
          path: ${{ runner.temp }}/wss-profile-provenance
      - name: Prepare immutable profile test project
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.profile-core-token.outputs.token }}
        run: >-
          ./.github/scripts/Prepare-CSharpProfile.ps1
          -IntegrationRoot .
          -WorkRoot "${{ runner.temp }}/wss-profile"
          -PayloadRoot "${{ env.WSS_ARTIFACT_DIR }}"
          -ProducerRecordPath "${{ runner.temp }}/wss-profile-provenance/candidate.json"

      - name: Restore with downloaded WSS assemblies
        shell: pwsh
        run: |
          dotnet restore -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
      - name: Build with downloaded WSS assemblies
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/restored-assets/RestoredAssets.ps1
          $builtProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $buildRestoreProof=New-WssRestoredAssetsProof -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -ProjectPath $env:WSS_PROFILE_PROJECT
          dotnet build -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Cache-disabled build failed.' }
          & "./.github/scripts/Verify-WssOutput.ps1" -ArtifactRoot $builtProfile.payload_root -OutputRoot (Join-Path $builtProfile.output_root 'Release/net9.0') -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -RestoreProof $buildRestoreProof
      - name: Run behavioral tests
        shell: pwsh
        run: ./.github/scripts/Invoke-WssBehavioralConformance.ps1

  compatibility:
    name: Preflight compatibility (${{ matrix.name }})
    needs: resolve-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      WSS_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
      WSS_BLE_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/download-artifact@v4
        with:
          name: verified-wss-universal
          path: ${{ env.WSS_ARTIFACT_DIR }}

      - name: Disable committed fallback and clean outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'lib' -PathType Container)) {
            throw 'Committed lib directory is missing.'
          }
          Move-Item -LiteralPath 'lib' -Destination 'lib.preflight-disabled'
          if (Test-Path -LiteralPath 'lib') {
            throw 'Committed lib fallback remains available.'
          }
          Get-ChildItem -Path src, tests -Directory -Recurse -Force |
            Where-Object Name -in @('bin', 'obj') |
            Remove-Item -Recurse -Force

      - name: Create profile producer read token
        id: profile-core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Download verified profile provenance
        uses: actions/download-artifact@v4
        with:
          name: wss-candidate-provenance
          path: ${{ runner.temp }}/wss-profile-provenance
      - name: Prepare immutable profile test project
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.profile-core-token.outputs.token }}
        run: >-
          ./.github/scripts/Prepare-CSharpProfile.ps1
          -IntegrationRoot .
          -WorkRoot "${{ runner.temp }}/wss-profile"
          -PayloadRoot "${{ env.WSS_ARTIFACT_DIR }}"
          -ProducerRecordPath "${{ runner.temp }}/wss-profile-provenance/candidate.json"

      - name: Restore with downloaded WSS assemblies
        shell: pwsh
        run: |
          dotnet restore -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
      - name: Build with downloaded WSS assemblies
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/restored-assets/RestoredAssets.ps1
          $builtProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $buildRestoreProof=New-WssRestoredAssetsProof -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -ProjectPath $env:WSS_PROFILE_PROJECT
          dotnet build -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Cache-disabled build failed.' }
          & "./.github/scripts/Verify-WssOutput.ps1" -ArtifactRoot $builtProfile.payload_root -OutputRoot (Join-Path $builtProfile.output_root 'Release/net9.0') -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -RestoreProof $buildRestoreProof
      - name: Verify downloaded artifact propagation
        shell: pwsh
        run: |
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot $env:WSS_ARTIFACT_DIR -OutputRoot 'tests/Wss.CSharpImplementation.Tests/bin/Release/net9.0' -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json')
          $profile = Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          . ./.github/scripts/wss-ci/restored-assets/RestoredAssets.ps1
          $publishRestoreProof=New-WssRestoredAssetsProof -ProjectAssetsFile (Join-Path $profile.source_root 'src/obj/project.assets.json') -ProjectPath (Join-Path $profile.source_root 'src/Wss.CSharpImplementation.csproj')
          dotnet publish -p:DisablePackageAssetsCache=true (Join-Path $profile.source_root 'src/Wss.CSharpImplementation.csproj') -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR" -o "$env:RUNNER_TEMP/integration-publish"
          if ($LASTEXITCODE -ne 0) { throw 'Integration publish failed.' }
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot $env:WSS_ARTIFACT_DIR -OutputRoot "$env:RUNNER_TEMP/integration-publish" -ProjectPath (Join-Path $profile.source_root 'src/Wss.CSharpImplementation.csproj') -ProjectAssetsFile (Join-Path $profile.source_root 'src/obj/project.assets.json') -RestoreProof $publishRestoreProof

      - name: Run platform compatibility tests
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/compiled-tests/CompiledCSharpTests.ps1
          $compiledProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $compiledProof=New-CompiledCSharpTestProof -OutputRoot (Join-Path $compiledProfile.output_root 'Release/net9.0') -AssemblyName 'Wss.CSharpImplementation.Tests.dll'
          Invoke-CompiledCSharpTests -Proof $compiledProof -ResultsDirectory (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'TestResults') -Filter "FullyQualifiedName~Wss.CSharpImplementation.Tests.SerialRuntimeSelectionTests|FullyQualifiedName~Wss.CSharpImplementation.Tests.BleBackendLoadingTests" -TrxFileName 'platform.trx'
  macos_architecture:
    name: macOS BLE detail (${{ matrix.cpu }})
    needs: resolve-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            label: macOS
            os: macos-15-intel
            arch: x64
            test_platform: x64
            cpu: Intel x86_64
          - name: macOS
            label: macOS
            os: macos-15
            arch: arm64
            test_platform: ARM64
            cpu: Apple Silicon arm64
    runs-on: ${{ matrix.os }}
    env:
      WSS_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
      WSS_BLE_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/download-artifact@v4
        with:
          name: verified-wss-universal
          path: ${{ env.WSS_ARTIFACT_DIR }}

      - name: Verify native macOS and dotnet architecture
        shell: pwsh
        env:
          DOTNET_CLI_UI_LANGUAGE: en-US
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Initialize-WssMacOSEvidence '${{ matrix.arch }}' 'wrapper-preflight' "$env:RUNNER_TEMP/macos-evidence"
      - name: Disable committed fallback and clean outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'lib' -PathType Container)) {
            throw 'Committed lib directory is missing.'
          }
          Move-Item -LiteralPath 'lib' -Destination 'lib.preflight-disabled'
          if (Test-Path -LiteralPath 'lib') {
            throw 'Committed lib fallback remains available.'
          }
          Get-ChildItem -Path src, tests -Directory -Recurse -Force |
            Where-Object Name -in @('bin', 'obj') |
            Remove-Item -Recurse -Force

      - name: Create profile producer read token
        id: profile-core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Download verified profile provenance
        uses: actions/download-artifact@v4
        with:
          name: wss-candidate-provenance
          path: ${{ runner.temp }}/wss-profile-provenance
      - name: Prepare immutable profile test project
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.profile-core-token.outputs.token }}
        run: >-
          ./.github/scripts/Prepare-CSharpProfile.ps1
          -IntegrationRoot .
          -WorkRoot "${{ runner.temp }}/wss-profile"
          -PayloadRoot "${{ env.WSS_ARTIFACT_DIR }}"
          -ProducerRecordPath "${{ runner.temp }}/wss-profile-provenance/candidate.json"

      - name: Restore with downloaded WSS assemblies
        shell: pwsh
        run: |
          dotnet restore -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
      - name: Build with downloaded WSS assemblies
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/restored-assets/RestoredAssets.ps1
          $builtProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $buildRestoreProof=New-WssRestoredAssetsProof -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -ProjectPath $env:WSS_PROFILE_PROJECT
          dotnet build -p:DisablePackageAssetsCache=true "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Cache-disabled build failed.' }
          & "./.github/scripts/Verify-WssOutput.ps1" -ArtifactRoot $builtProfile.payload_root -OutputRoot (Join-Path $builtProfile.output_root 'Release/net9.0') -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json') -RestoreProof $buildRestoreProof
      - name: Verify downloaded artifact propagation
        shell: pwsh
        run: |
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot $env:WSS_ARTIFACT_DIR -OutputRoot 'tests/Wss.CSharpImplementation.Tests/bin/Release/net9.0' -ProjectPath $env:WSS_PROFILE_PROJECT -ProjectAssetsFile (Join-Path (Split-Path -Parent $env:WSS_PROFILE_PROJECT) 'obj/project.assets.json')
          $profile = Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          . ./.github/scripts/wss-ci/restored-assets/RestoredAssets.ps1
          $publishRestoreProof=New-WssRestoredAssetsProof -ProjectAssetsFile (Join-Path $profile.source_root 'src/obj/project.assets.json') -ProjectPath (Join-Path $profile.source_root 'src/Wss.CSharpImplementation.csproj')
          dotnet publish -p:DisablePackageAssetsCache=true (Join-Path $profile.source_root 'src/Wss.CSharpImplementation.csproj') -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR" -o "$env:RUNNER_TEMP/integration-publish"
          if ($LASTEXITCODE -ne 0) { throw 'Integration publish failed.' }
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot $env:WSS_ARTIFACT_DIR -OutputRoot "$env:RUNNER_TEMP/integration-publish" -ProjectPath (Join-Path $profile.source_root 'src/Wss.CSharpImplementation.csproj') -ProjectAssetsFile (Join-Path $profile.source_root 'src/obj/project.assets.json') -RestoreProof $publishRestoreProof

      - name: Run platform compatibility tests
        shell: pwsh
        run: |
          . ./.github/scripts/wss-ci/compiled-tests/CompiledCSharpTests.ps1
          $compiledProfile=Get-Content $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $compiledProof=New-CompiledCSharpTestProof -OutputRoot (Join-Path $compiledProfile.output_root 'Release/net9.0') -AssemblyName 'Wss.CSharpImplementation.Tests.dll'
          Invoke-CompiledCSharpTests -Proof $compiledProof -ResultsDirectory "$env:RUNNER_TEMP/macos-results" -Filter "FullyQualifiedName~Wss.CSharpImplementation.Tests.SerialRuntimeSelectionTests|FullyQualifiedName~Wss.CSharpImplementation.Tests.BleBackendLoadingTests" -TrxFileName 'macos-platform.trx' -Platform '${{ matrix.test_platform }}' -DetailedConsole | Tee-Object -FilePath "$env:RUNNER_TEMP/macos-platform.log"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical platform tests failed.' }

      - name: Record canonical packaged BLE result before any synthetic fixture
        if: always()
        shell: pwsh
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Write-WssMacOSEvidence '${{ matrix.arch }}' 'wrapper-preflight' "$env:RUNNER_TEMP/macos-evidence" "$env:RUNNER_TEMP/macos-results/macos-platform.trx" "$env:RUNNER_TEMP/macos-platform.log" 'tests/Wss.CSharpImplementation.Tests/bin/Release/net9.0'


      - name: Verify selected macOS output rejects missing native payload
        shell: pwsh
        run: ./.github/scripts/Test-MacBleFixture.ps1 -OutputRoot 'tests/Wss.CSharpImplementation.Tests/bin/Release/net9.0' -WorkRoot "$env:RUNNER_TEMP/macos-ble-fixture" -TestPlatform '${{ matrix.test_platform }}'

      - name: Retain macOS fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ble-preflight-fixture-${{ matrix.arch }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-ble-fixture/fixture-evidence.json
            ${{ runner.temp }}/macos-ble-fixture/missing-native-rejection.log
            ${{ runner.temp }}/macos-ble-fixture/results/*.trx
          if-no-files-found: warn

      - name: Finalize architecture evidence including all worker steps
        if: always()
        shell: pwsh
        env:
          WORKER_RESULT: ${{ job.status }}
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Finalize-WssMacOSEvidence '${{ matrix.arch }}' 'wrapper-preflight' "$env:RUNNER_TEMP/macos-evidence" $env:WORKER_RESULT
      - name: Retain architecture-specific canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wss-macos-wrapper-preflight-${{ matrix.arch }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-evidence/*.json
            ${{ runner.temp }}/macos-results/*.trx
            ${{ runner.temp }}/macos-platform.log
            ${{ runner.temp }}/macos-cli.log
          if-no-files-found: error

  macos_compatibility:
    name: Preflight compatibility (macOS)
    needs: macos_architecture
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gather both native architecture records
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: wss-macos-wrapper-preflight-*-a${{ github.run_attempt }}
          path: macos-evidence
      - name: Require Intel and Apple Silicon success and show failures separately
        if: always()
        shell: pwsh
        env:
          WORKER_RESULT: ${{ needs.macos_architecture.result }}
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Complete-WssMacOSGate 'macos-evidence' 'wrapper-preflight' $env:WORKER_RESULT
