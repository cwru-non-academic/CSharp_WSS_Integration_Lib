name: Dispatch CLI Integration promotion
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Resume application promotion / wss-{0}', inputs.producer_run_id) || format('Dispatch CLI promotion for {0}', github.event.pull_request.merge_commit_sha) }}

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        required: true
        type: string
      barrier_run_id:
        required: true
        type: string
      barrier_attempt:
        required: true
        type: string
      channel: {description: Authorized target channel, required: false, default: dev, type: choice, options: [dev, main]}
  pull_request_target:
    types:
      - closed
    branches:
      - dev
      - main

env:
  WSS_CI_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.event.pull_request.base.ref }}
  WSS_TARGET_ROOT: ${{ github.workspace }}
  WSS_CORE_TOOLS_ROOT: ${{ github.workspace }}/workflow-guard
  PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: csharp-cli-fanout
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch CLI promotion
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'main') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'automation/wss-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # pull_request_target uses trusted base code, never executable PR-head code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read locked Core guard source
        id: guard
        shell: pwsh
        run: |
          $lock=Get-Content .github/scripts/wss-ci.lock.json -Raw|ConvertFrom-Json
          if($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)"){throw 'Invalid immutable Core guard lock.'}
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: cwru-non-academic/WSSCore
          ref: main
          path: .core-stage
          persist-credentials: false
      - name: Require staged integration barrier or verified legacy producer
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          BARRIER_RUN_ID: ${{ inputs.barrier_run_id }}
          BARRIER_ATTEMPT: ${{ inputs.barrier_attempt }}
        run: |
          # WSS diagnostic envelope v1: observational only; absent completion means unknown.
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          try { . ./.github/scripts/wss-ci/PhaseDiagnostics.ps1 } catch { }
          try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'resolve-stage' -Status 'started' -Boundary -ErrorCode 'none' } catch { }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
          try {
              ./.github/scripts/Prepare-StagedApplicationFanout.ps1 -Receiver csharp -RecordPath lib/wss-candidate.json -WorkRoot "$env:RUNNER_TEMP/cli-stage"
          } catch {
              $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'resolve-stage' -Status 'failed' -Boundary -ErrorCode 'terminating-error' } catch { }
              if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
              throw
          }
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          if ($null -ne $wssDiagnosticExit -and $wssDiagnosticExit -ne 0) {
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'resolve-stage' -Status 'failed' -Boundary -ErrorCode 'native-nonzero' } catch { }
          } else {
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'resolve-stage' -Status 'completed' -Boundary -ErrorCode 'none' } catch { }
          }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
      - name: Validate promotion metadata
        if: steps.stage.outputs.dispatch_allowed == 'true'
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.stage.outputs.merge_sha }}
          FANOUT_EVENT: ${{ steps.stage.outputs.event_path }}
        run: |
          # WSS diagnostic envelope v1: observational only; absent completion means unknown.
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          try { . ./.github/scripts/wss-ci/PhaseDiagnostics.ps1 } catch { }
          try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'validate-metadata' -Status 'started' -Boundary -ErrorCode 'none' } catch { }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
          try {
              $ErrorActionPreference = 'Stop'
              . ./.github/scripts/WssPromotion.ps1
              $event = Get-Content -LiteralPath $env:FANOUT_EVENT -Raw | ConvertFrom-Json
              $body = [string]$event.pull_request.body

              if ($env:MERGE_SHA -cnotmatch '^[0-9a-fA-F]{40}$') {
                throw 'The merged PR does not provide a valid resulting Integration SHA.'
              }
              if ([Regex]::Matches($body, '<!-- wss-promotion:v2 -->').Count -ne 1) {
                throw 'The merged automation PR lacks the unique WSS promotion marker.'
              }

              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'validate-approval' -Status 'started' -ErrorCode 'none' } catch { } # wss-diag
              $approval = Read-WssApprovalMarker $body "$env:RUNNER_TEMP/approval.json"
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'validate-approval' -Status 'completed' -ErrorCode 'none' } catch { } # wss-diag
              $correlationMatch = [Regex]::Match($body, '(?m)^<!-- correlation-id:(?<value>[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}) -->\r?$')
              if (-not $correlationMatch.Success) {
                throw 'The merged automation PR has missing or invalid promotion metadata.'
              }
              if ([Regex]::Matches($body, '(?m)^<!-- correlation-id:').Count -ne 1) {
                throw 'The merged automation PR contains ambiguous promotion metadata.'
              }

              $expectedBranch = Get-WssBranch $approval
              if ($event.pull_request.head.ref -cne $expectedBranch) {
                throw "Promotion metadata does not match the automation branch $expectedBranch."
              }

              $pages = Invoke-WssGh -Arguments @('api', '--paginate', '--slurp', "repos/$($event.repository.full_name)/pulls/$($event.pull_request.number)/files?per_page=100") | ConvertFrom-Json
              $changedFiles = @($pages | ForEach-Object { $_ })
              if ($changedFiles.Count -eq 0) {
                throw 'The merged automation PR has no readable changed files.'
              }
              $unexpectedFiles = @($changedFiles | Where-Object { $_.filename -notmatch '^lib/' })
              if ($unexpectedFiles.Count -ne 0) {
                throw "The merged automation PR changed files outside lib/: $($unexpectedFiles.filename -join ', ')"
              }

              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'validate-reviewed-merge' -Status 'started' -ErrorCode 'none' } catch { } # wss-diag
              $null = Assert-WssMergedIntegration $env:MERGE_SHA ([string]$event.pull_request.number) $approval
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'validate-reviewed-merge' -Status 'completed' -ErrorCode 'none' } catch { } # wss-diag
              "integration_sha=$($env:MERGE_SHA.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
              "integration_pr=$($event.pull_request.number)" >> $env:GITHUB_OUTPUT
              "approval_json=$($approval | ConvertTo-Json -Depth 5 -Compress)" >> $env:GITHUB_OUTPUT
              "correlation_id=$($correlationMatch.Groups['value'].Value)" >> $env:GITHUB_OUTPUT
          } catch {
              $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'validate-metadata' -Status 'failed' -Boundary -ErrorCode 'terminating-error' } catch { }
              if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
              throw
          }
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          if ($null -ne $wssDiagnosticExit -and $wssDiagnosticExit -ne 0) {
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'validate-metadata' -Status 'failed' -Boundary -ErrorCode 'native-nonzero' } catch { }
          } else {
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'validate-metadata' -Status 'completed' -Boundary -ErrorCode 'none' } catch { }
          }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }

      - name: Prepare exact CLI dispatch or verify successful reuse
        if: steps.stage.outputs.dispatch_allowed == 'true'
        id: intent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_SHA: ${{ steps.metadata.outputs.integration_sha }}
          INTEGRATION_PR: ${{ steps.metadata.outputs.integration_pr }}
          CORRELATION_ID: ${{ steps.metadata.outputs.correlation_id }}
        run: |
          # WSS diagnostic envelope v1: observational only; absent completion means unknown.
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          try { . ./.github/scripts/wss-ci/PhaseDiagnostics.ps1 } catch { }
          try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'prepare-intent' -Status 'started' -Boundary -ErrorCode 'none' } catch { }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
          try {
              . ./.github/scripts/WssFanout.ps1
              New-WssCliDispatchRequest $env:INTEGRATION_SHA $env:INTEGRATION_PR $env:CORRELATION_ID "$env:RUNNER_TEMP/approval.json" "$env:RUNNER_TEMP/cli-dispatch.json"
          } catch {
              $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'prepare-intent' -Status 'failed' -Boundary -ErrorCode 'terminating-error' } catch { }
              if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
              throw
          }
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          if ($null -ne $wssDiagnosticExit -and $wssDiagnosticExit -ne 0) {
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'prepare-intent' -Status 'failed' -Boundary -ErrorCode 'native-nonzero' } catch { }
          } else {
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'prepare-intent' -Status 'completed' -Boundary -ErrorCode 'none' } catch { }
          }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }

      - name: Record CLI dispatch intent before write credentials
        if: steps.intent.outputs.dispatch_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: csharp-cli-dispatch-${{ steps.metadata.outputs.integration_sha }}
          path: ${{ runner.temp }}/cli-dispatch.json
          if-no-files-found: error
          retention-days: 90

      - name: Recheck integration barrier immediately before CLI writes
        if: github.event_name == 'workflow_dispatch' && steps.intent.outputs.dispatch_needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          BARRIER_RUN_ID: ${{ inputs.barrier_run_id }}
          BARRIER_ATTEMPT: ${{ inputs.barrier_attempt }}
          EXPECTED_MERGE_SHA: ${{ steps.metadata.outputs.integration_sha }}
        run: |
          # WSS diagnostic envelope v1: observational only; absent completion means unknown.
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          try { . ./.github/scripts/wss-ci/PhaseDiagnostics.ps1 } catch { }
          try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'recheck-barrier' -Status 'started' -Boundary -ErrorCode 'none' } catch { }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
          try {
              ./.github/scripts/Prepare-StagedApplicationFanout.ps1 -Receiver csharp -RecordPath lib/wss-candidate.json -WorkRoot "$env:RUNNER_TEMP/cli-stage-recheck" -ExpectedMergeSha $env:EXPECTED_MERGE_SHA
          } catch {
              $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'recheck-barrier' -Status 'failed' -Boundary -ErrorCode 'terminating-error' } catch { }
              if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
              throw
          }
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          if ($null -ne $wssDiagnosticExit -and $wssDiagnosticExit -ne 0) {
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'recheck-barrier' -Status 'failed' -Boundary -ErrorCode 'native-nonzero' } catch { }
          } else {
              try { Write-WssCiPhaseDiagnostic -Family 'csharp' -Role 'cli' -Operation 'recheck-barrier' -Status 'completed' -Boundary -ErrorCode 'none' } catch { }
          }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }

      - name: Create CLI Actions token
        if: steps.intent.outputs.dispatch_needed == 'true'
        id: cli-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CLI_CSharp_WSS_Application
          permission-actions: write

      - name: Dispatch CLI promotion workflow
        if: steps.intent.outputs.dispatch_needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.cli-token.outputs.token }}
          WSS_CLI_DISPATCH_READ_TOKEN: ${{ github.token }}
        run: |
          . ./.github/scripts/WssFanout.ps1
          Send-WssCliDispatch "$env:RUNNER_TEMP/cli-dispatch.json" $env:WSS_CLI_DISPATCH_READ_TOKEN $env:GH_TOKEN
