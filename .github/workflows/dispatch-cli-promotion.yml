name: Dispatch CLI Integration promotion
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Resume application promotion / wss-{0}', inputs.producer_run_id) || format('Dispatch CLI promotion for {0}', github.event.pull_request.merge_commit_sha) }}

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        required: true
        type: string
      barrier_run_id:
        required: true
        type: string
      barrier_attempt:
        required: true
        type: string
  pull_request_target:
    types:
      - closed
    branches:
      - dev

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: dispatch-cli-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch CLI promotion
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'automation/wss-'))
    runs-on: ubuntu-latest
    steps:
      # pull_request_target uses trusted base code, never executable PR-head code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: cwru-non-academic/WSSCore
          ref: main
          path: .core-stage
          persist-credentials: false
      - name: Require staged integration barrier or verified legacy producer
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          BARRIER_RUN_ID: ${{ inputs.barrier_run_id }}
          BARRIER_ATTEMPT: ${{ inputs.barrier_attempt }}
        run: ./.github/scripts/Prepare-StagedApplicationFanout.ps1 -Receiver csharp -RecordPath lib/wss-candidate.json -WorkRoot "$env:RUNNER_TEMP/cli-stage"
      - name: Validate promotion metadata
        if: steps.stage.outputs.dispatch_allowed == 'true'
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.stage.outputs.merge_sha }}
          FANOUT_EVENT: ${{ steps.stage.outputs.event_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssPromotion.ps1
          $event = Get-Content -LiteralPath $env:FANOUT_EVENT -Raw | ConvertFrom-Json
          $body = [string]$event.pull_request.body

          if ($env:MERGE_SHA -cnotmatch '^[0-9a-fA-F]{40}$') {
            throw 'The merged PR does not provide a valid resulting Integration SHA.'
          }
          if ([Regex]::Matches($body, '<!-- wss-promotion:v2 -->').Count -ne 1) {
            throw 'The merged automation PR lacks the unique WSS promotion marker.'
          }

          $approval = Read-WssApprovalMarker $body "$env:RUNNER_TEMP/approval.json"
          $correlationMatch = [Regex]::Match($body, '(?m)^<!-- correlation-id:(?<value>[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}) -->\r?$')
          if (-not $correlationMatch.Success) {
            throw 'The merged automation PR has missing or invalid promotion metadata.'
          }
          if ([Regex]::Matches($body, '(?m)^<!-- correlation-id:').Count -ne 1) {
            throw 'The merged automation PR contains ambiguous promotion metadata.'
          }

          $expectedBranch = Get-WssBranch $approval
          if ($event.pull_request.head.ref -cne $expectedBranch) {
            throw "Promotion metadata does not match the automation branch $expectedBranch."
          }

          $pages = Invoke-WssGh @('api', '--paginate', '--slurp', "repos/$($event.repository.full_name)/pulls/$($event.pull_request.number)/files?per_page=100") | ConvertFrom-Json
          $changedFiles = @($pages | ForEach-Object { $_ })
          if ($changedFiles.Count -eq 0) {
            throw 'The merged automation PR has no readable changed files.'
          }
          $unexpectedFiles = @($changedFiles | Where-Object { $_.filename -notmatch '^lib/' })
          if ($unexpectedFiles.Count -ne 0) {
            throw "The merged automation PR changed files outside lib/: $($unexpectedFiles.filename -join ', ')"
          }

          $null = Assert-WssMergedIntegration $env:MERGE_SHA ([string]$event.pull_request.number) $approval
          "integration_sha=$($env:MERGE_SHA.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "integration_pr=$($event.pull_request.number)" >> $env:GITHUB_OUTPUT
          "approval_json=$($approval | ConvertTo-Json -Depth 5 -Compress)" >> $env:GITHUB_OUTPUT
          "correlation_id=$($correlationMatch.Groups['value'].Value)" >> $env:GITHUB_OUTPUT

      - name: Recheck integration barrier immediately before CLI writes
        if: github.event_name == 'workflow_dispatch' && steps.stage.outputs.dispatch_allowed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          BARRIER_RUN_ID: ${{ inputs.barrier_run_id }}
          BARRIER_ATTEMPT: ${{ inputs.barrier_attempt }}
        run: ./.github/scripts/Prepare-StagedApplicationFanout.ps1 -Receiver csharp -RecordPath lib/wss-candidate.json -WorkRoot "$env:RUNNER_TEMP/cli-stage-recheck"

      - name: Create CLI Actions token
        if: steps.stage.outputs.dispatch_allowed == 'true'
        id: cli-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CLI_CSharp_WSS_Application
          permission-actions: write

      - name: Dispatch CLI promotion workflow
        if: steps.stage.outputs.dispatch_allowed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.cli-token.outputs.token }}
          INTEGRATION_SHA: ${{ steps.metadata.outputs.integration_sha }}
          APPROVAL_JSON: ${{ steps.metadata.outputs.approval_json }}
          INTEGRATION_PR: ${{ steps.metadata.outputs.integration_pr }}
          CORRELATION_ID: ${{ steps.metadata.outputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          & gh workflow run promote-integration.yml `
            --repo cwru-non-academic/CLI_CSharp_WSS_Application `
            --ref dev `
            --field "integration_sha=$($env:INTEGRATION_SHA)" `
            --field "approval_json=$($env:APPROVAL_JSON)" `
            --field "integration_pr=$($env:INTEGRATION_PR)" `
            --field "correlation_id=$($env:CORRELATION_ID)"
          if ($LASTEXITCODE -ne 0) {
            throw 'CLI promote-integration workflow dispatch failed.'
          }

          @(
            'Dispatched CLI promote-integration.yml.'
            "- Integration SHA: ``$($env:INTEGRATION_SHA)``"
            "- Merged Integration PR: #$($env:INTEGRATION_PR)"
            "- Correlation ID: ``$($env:CORRELATION_ID)``"
          ) >> $env:GITHUB_STEP_SUMMARY
