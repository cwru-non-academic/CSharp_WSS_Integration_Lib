name: Promote WSS into Integration
run-name: Promote universal WSS / ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      approval_json:
        description: Schema-2 candidate and matching downstream preflight approval JSON
        required: false
        type: string
      wss_run_id:
        description: Automatic handoff from the trusted WSSCore dev producer (exclusive with approval_json)
        type: string
      wss_commit:
        description: Exact automatic producer commit
        type: string
      wss_artifact_id:
        description: Exact automatic universal Actions artifact ID
        type: string
      wss_sha256:
        description: Exact automatic WSS-Universal-ci.zip SHA-256
        type: string
      correlation_id:
        description: Promotion-cascade correlation ID
        required: true
        type: string

env:
  WSS_CI_CHANNEL: ${{ github.ref_name }}
  WSS_TARGET_ROOT: ${{ github.workspace }}
  WSS_CORE_TOOLS_ROOT: ${{ github.workspace }}/workflow-guard
permissions:
  contents: read

concurrency:
  group: promote-wss-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    name: Create WSS promotion PR
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate trusted handoff inputs before credentials
        shell: pwsh
        env:
          APPROVAL_JSON: ${{ inputs.approval_json }}
          RUN_ID: ${{ inputs.wss_run_id }}
          COMMIT: ${{ inputs.wss_commit }}
          ARTIFACT_ID: ${{ inputs.wss_artifact_id }}
          SHA256: ${{ inputs.wss_sha256 }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          APP_ID: ${{ vars.WSS_GITHUB_APP_ID }}
          APP_KEY: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CORRELATION_ID -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$') {
            throw 'correlation_id must be 1-200 branch-safe, single-line characters.'
          }
          if ($env:RUN_ID) {
            if ($env:APPROVAL_JSON -or $env:RUN_ID -cnotmatch '^[1-9][0-9]*$' -or
                $env:ARTIFACT_ID -cnotmatch '^[1-9][0-9]*$' -or $env:COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
                $env:SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:CORRELATION_ID -cne "wss-$env:RUN_ID-$env:ARTIFACT_ID") { throw 'Invalid or mixed automatic handoff inputs.' }
          } elseif (-not $env:APPROVAL_JSON -or $env:COMMIT -or $env:ARTIFACT_ID -or $env:SHA256) { throw 'Supply either approval_json or the complete automatic producer tuple.' }
          if (-not $env:APP_ID -or -not $env:APP_KEY) { throw 'WSS GitHub App credentials are unavailable to Integration.' }

      - name: Create WSSCore read token
        id: core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read

      - name: Create preflight evidence read token
        id: evidence-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            CSharp_WSS_Integration_Lib
            CLI_CSharp_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Check out current Integration dev
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.evidence-token.outputs.token }}
          persist-credentials: false

      - name: Read locked Core guard source
        id: guard
        shell: pwsh
        run: |
          $lock=Get-Content .github/scripts/wss-ci.lock.json -Raw|ConvertFrom-Json
          if($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)"){throw 'Invalid immutable Core guard lock.'}
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - name: Record trusted promotion base
        id: source
        shell: pwsh
        run: |
          $sha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve trusted promotion base.' }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Wait for successful dev producer and verify exact automatic candidate
        if: inputs.wss_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
          RUN_ID: ${{ inputs.wss_run_id }}
          COMMIT: ${{ inputs.wss_commit }}
          ARTIFACT_ID: ${{ inputs.wss_artifact_id }}
          SHA256: ${{ inputs.wss_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssAutomatic.ps1
          if((Get-WssCiChannel) -ceq 'main' -and ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA -or $env:GITHUB_WORKFLOW_REF -cne "$env:GITHUB_REPOSITORY/.github/workflows/promote-wss.yml@refs/heads/main")){throw 'Main automatic promotion must execute its exact registered source.'}
          $repo = 'cwru-non-academic/WSSCore'
          $run = Invoke-WssGh -Arguments @('api', "repos/$repo/actions/runs/$env:RUN_ID") | ConvertFrom-Json
          Assert-WssAutomaticProducer $run $env:COMMIT
          # The producer's final gated job dispatched us; its entire run must now finish green.
          $run = Wait-WssExactRun $repo $env:RUN_ID $env:COMMIT 'artifacts.yml' 'push'
          Assert-WssAutomaticProducer $run $env:COMMIT
          $compare = Invoke-WssGh -Arguments @('api', "repos/$repo/compare/$env:COMMIT...$env:WSS_CI_CHANNEL") | ConvertFrom-Json
          if ($compare.status -notin @('ahead', 'identical')) { throw 'Producer commit is not contained in WSSCore dev.' }
          $pages = Invoke-WssGh -Arguments @('api', '--paginate', '--slurp', "repos/$repo/actions/runs/$env:RUN_ID/attempts/$($run.run_attempt)/jobs?per_page=100") | ConvertFrom-Json
          $jobs = @($pages | ForEach-Object { $_.jobs })
          . ./.github/scripts/wss-ci/Producer.ps1
          Assert-WssCiProducerJobs $jobs 'macos-ble-v1'
          ./.github/scripts/Resolve-WssRelease.ps1 -RunId $env:RUN_ID -ExpectedCommit $env:COMMIT -ArchiveName WSS-Universal-ci.zip -ExpectedSha256 $env:SHA256 -OutputRoot "$env:RUNNER_TEMP/automatic-candidate"
          $candidate = Get-Content "$env:RUNNER_TEMP/automatic-candidate/candidate.json" -Raw | ConvertFrom-Json
          if ([string]$candidate.artifact_id -cne $env:ARTIFACT_ID) { throw 'Automatic producer artifact ID mismatch.' }
          if((Get-WssCiChannel) -ceq 'main'){$proof=Assert-WssCiWorkflowAuthorization ([string]$candidate.run_id);Assert-WssCandidateRecord $proof.candidate ([pscustomobject]@{candidate=$candidate})}

      - name: Create downstream preflight dispatch token only after producer trust checks
        if: inputs.wss_run_id != ''
        id: preflight-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            CSharp_WSS_Integration_Lib
            CLI_CSharp_WSS_Application
          permission-contents: read
          permission-actions: write

      - name: Automatically execute or reuse exact correlated downstream preflights
        if: inputs.wss_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.preflight-token.outputs.token }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssAutomatic.ps1
          $candidate = Get-Content "$env:RUNNER_TEMP/automatic-candidate/candidate.json" -Raw | ConvertFrom-Json
          $approval = New-WssAutomaticApproval $candidate $env:CORRELATION_ID
          Write-WssApproval $approval "$env:RUNNER_TEMP/approval.json"

      - name: Normalize automatic or operator-supplied approval
        id: inputs
        shell: pwsh
        env:
          APPROVAL_JSON: ${{ inputs.approval_json }}
          RUN_ID: ${{ inputs.wss_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssPromotion.ps1
          if (-not $env:RUN_ID) { $env:APPROVAL_JSON | Set-Content "$env:RUNNER_TEMP/approval.json" }
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          Write-WssApproval $approval "$env:RUNNER_TEMP/approval.json"
          "branch=$(Get-WssBranch $approval)" >> $env:GITHUB_OUTPUT
          "candidate_id=$($approval.candidate.run_id)" >> $env:GITHUB_OUTPUT

      - name: Validate matching preflight approvals
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssPromotion.ps1
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          Assert-WssApproval $approval "$env:RUNNER_TEMP/evidence" -RequireCanonicalDev:((Get-WssCiChannel) -ceq 'main')
          Assert-WssSource '.' $approval.integration.source_sha
          . ./.github/scripts/WssAutomatic.ps1
          Assert-WssCandidateNotOlder $approval.candidate '${{ steps.source.outputs.sha }}'

      - name: Download, verify, and stage the approved universal candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'wss-release'
          $desiredLib = Join-Path $env:RUNNER_TEMP 'desired-lib'
          . ./.github/scripts/WssPromotion.ps1
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          ./.github/scripts/Resolve-WssRelease.ps1 `
            -ProducerRepository $approval.candidate.repository -RunId $approval.candidate.run_id `
            -ExpectedCommit $approval.candidate.commit -ArchiveName $approval.candidate.archive -ExpectedSha256 $approval.candidate.sha256 `
            -OutputRoot $releaseRoot
          Assert-WssCandidateRecord (Get-Content "$releaseRoot/candidate.json" -Raw | ConvertFrom-Json) $approval
          ./.github/scripts/New-WssLib.ps1 `
            -ArtifactRoot (Join-Path $releaseRoot 'extracted/WSS-Universal') -ApprovalFile "$env:RUNNER_TEMP/approval.json" `
            -Destination $desiredLib

      - name: Retain verified approval for audit and no-op provenance
        uses: actions/upload-artifact@v4
        with:
          name: wss-automatic-approval
          path: ${{ runner.temp }}/approval.json
          if-no-files-found: error

      - name: Create Integration write token only after candidate and approval validation
        id: integration-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CSharp_WSS_Integration_Lib
          permission-contents: write
          permission-pull-requests: write

      - name: Bind authoring checkout to the validated promotion base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.integration-token.outputs.token }}

      - name: Inspect existing automation state
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.integration-token.outputs.token }}
          BRANCH_NAME: ${{ steps.inputs.outputs.branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssAutomatic.ps1
          if (Test-WssPayloadEqual 'lib' "$env:RUNNER_TEMP/wss-release/extracted/WSS-Universal") {
            'branch_exists=false' >> $env:GITHUB_OUTPUT
            'pr_number=' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $previousNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false

            $pullJson = & gh pr list `
              --repo cwru-non-academic/CSharp_WSS_Integration_Lib `
              --state all `
              --base $env:WSS_CI_CHANNEL `
              --head $env:BRANCH_NAME `
              --limit 2 `
              --json number,url,state
            $prListExitCode = $LASTEXITCODE
            if ($prListExitCode -ne 0) {
              throw "Failed to query existing promotion PRs; gh exited with code $prListExitCode."
            }

            $pulls = @($pullJson | ConvertFrom-Json)
            if ($pulls.Count -gt 1) {
              throw "Multiple promotion PRs use $($env:BRANCH_NAME)."
            }
            if ($pulls.Count -eq 1 -and $pulls[0].state -cne 'OPEN') { throw 'Candidate promotion PR was already merged or closed; refusing a duplicate or dependency rollback PR.' }
            $hasExistingPr = $pulls.Count -eq 1
            "Existing promotion PR: $(if ($hasExistingPr) { 'YES' } else { 'NO' })"

            & git ls-remote --exit-code --heads origin "refs/heads/$($env:BRANCH_NAME)" *> $null
            $branchProbeExitCode = $LASTEXITCODE
            $branchExists = switch ($branchProbeExitCode) {
              0 { $true; break }
              2 { $false; break }
              default {
                throw "Failed to inspect the remote automation branch; git ls-remote exited with code $branchProbeExitCode."
              }
            }
            "Automation branch exists: $(if ($branchExists) { 'YES' } else { 'NO' })"

            if ($hasExistingPr -and -not $branchExists) {
              throw 'An open promotion PR exists, but its automation branch is missing.'
            }
          }
          finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativeErrorPreference
          }

          $global:LASTEXITCODE = 0
          if ($hasExistingPr) {
            "pr_number=$($pulls[0].number)" >> $env:GITHUB_OUTPUT
            "pr_url=$($pulls[0].url)" >> $env:GITHUB_OUTPUT
          } else {
            'pr_number=' >> $env:GITHUB_OUTPUT
          }
          "branch_exists=$($branchExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Check out existing automation branch
        if: steps.existing.outputs.branch_exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.branch }}
          path: existing-promotion
          fetch-depth: 0
          token: ${{ steps.integration-token.outputs.token }}

      - name: Validate existing automation branch and PR
        if: steps.existing.outputs.branch_exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.integration-token.outputs.token }}
          PR_NUMBER: ${{ steps.existing.outputs.pr_number }}
          PR_URL: ${{ steps.existing.outputs.pr_url }}
          CANDIDATE_ID: ${{ steps.inputs.outputs.candidate_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssPromotion.ps1
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          if (-not [string]::IsNullOrEmpty($env:PR_NUMBER)) {
            $pr = & gh pr view $env:PR_NUMBER `
              --repo cwru-non-academic/CSharp_WSS_Integration_Lib `
              --json body | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to inspect the existing promotion PR.'
            }

            $requiredMarkers = @(
              '<!-- wss-promotion:v2 -->',
              (Get-WssApprovalMarker $approval),
              "<!-- correlation-id:$($env:CORRELATION_ID) -->"
            )
            foreach ($marker in $requiredMarkers) {
              if (-not $pr.body.Contains($marker, [StringComparison]::Ordinal)) {
                throw "Existing promotion PR has mismatched metadata: $marker"
              }
            }
            $existingApproval = Read-WssApprovalMarker $pr.body "$env:RUNNER_TEMP/existing-approval.json"
            if ((Get-WssApprovalMarker $existingApproval) -cne (Get-WssApprovalMarker $approval) -or
                [Regex]::Matches($pr.body, '<!-- wss-promotion:v2 -->').Count -ne 1 -or
                [Regex]::Matches($pr.body, '(?m)^<!-- correlation-id:').Count -ne 1) { throw 'Existing PR has ambiguous or mismatched promotion metadata.' }

            $pages = Invoke-WssGh -Arguments @('api', '--paginate', '--slurp', "repos/cwru-non-academic/CSharp_WSS_Integration_Lib/pulls/$($env:PR_NUMBER)/files?per_page=100") | ConvertFrom-Json
            $files = @($pages | ForEach-Object { $_ })
            if ($files.Count -eq 0) {
              throw 'Existing promotion PR has no readable changed files.'
            }
            $unexpected = @($files | Where-Object { $_.filename -notmatch '^lib/' })
            if ($unexpected.Count -ne 0) {
              throw "Existing promotion PR changes files outside lib/: $($unexpected.filename -join ', ')"
            }
          }

          & git diff --no-index --quiet -- `
            (Join-Path $env:RUNNER_TEMP 'desired-lib') `
            'existing-promotion/lib'
          if ($LASTEXITCODE -ne 0) {
            throw 'Existing promotion PR does not contain the intended lib state.'
          }

          $branchFiles = @(& git -C existing-promotion diff --name-only "origin/$env:WSS_CI_CHANNEL...HEAD")
          if ($LASTEXITCODE -ne 0 -or $branchFiles.Count -eq 0) {
            throw 'Existing automation branch has no readable diff from dev.'
          }
          $unexpectedBranchFiles = @($branchFiles | Where-Object { $_ -notmatch '^lib/' })
          if ($unexpectedBranchFiles.Count -ne 0) {
            throw "Existing automation branch changes files outside lib/: $($unexpectedBranchFiles -join ', ')"
          }

          Assert-WssSource 'existing-promotion' $approval.integration.source_sha
          $commitMessage = & git -C existing-promotion log -1 --format=%B
          if ($LASTEXITCODE -ne 0 -or
              $commitMessage -notcontains "Promote WSS run $($env:CANDIDATE_ID)" -or
              $commitMessage -notcontains "Correlation-ID: $($env:CORRELATION_ID)") {
            throw 'Existing automation branch has mismatched deterministic commit metadata.'
          }

          if ([string]::IsNullOrEmpty($env:PR_NUMBER)) {
            'Validated an interrupted promotion branch; the missing PR will be created.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Reusing matching promotion PR: $($env:PR_URL)" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Replace artifact-managed lib contents
        if: steps.existing.outputs.branch_exists == 'false'
        shell: pwsh
        env:
          BRANCH_NAME: ${{ steps.inputs.outputs.branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          & git switch -c $env:BRANCH_NAME
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create the local automation branch.'
          }

          . ./.github/scripts/WssAutomatic.ps1
          if (Test-WssPayloadEqual 'lib' "$env:RUNNER_TEMP/wss-release/extracted/WSS-Universal") {
            'Verified no-op: universal dependency bytes already match dev; committed provenance is preserved, and no metadata-only PR is manufactured. The newly verified approval is retained as an Actions artifact.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          Remove-Item -LiteralPath 'lib' -Recurse -Force
          New-Item -ItemType Directory -Path 'lib' | Out-Null
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'desired-lib/*') -Destination 'lib' -Recurse

      - name: Validate and stage the lib-only diff
        if: steps.existing.outputs.branch_exists == 'false'
        id: commit
        shell: pwsh
        env:
          CANDIDATE_ID: ${{ steps.inputs.outputs.candidate_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workingTreeChanges = @(& git status --short --untracked-files=all)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect the promotion working tree.'
          }
          if ($workingTreeChanges.Count -eq 0) {
            'no_change=true' >> $env:GITHUB_OUTPUT
            'Integration dev already contains the intended promoted lib state.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $unexpectedWorkingTreeChanges = @($workingTreeChanges | Where-Object {
            $_.Length -lt 4 -or $_.Substring(3).Trim('"') -notmatch '^lib/'
          })
          if ($unexpectedWorkingTreeChanges.Count -ne 0) {
            throw "Promotion changed files outside lib/: $($unexpectedWorkingTreeChanges -join ', ')"
          }

          & git add -A -- lib
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to stage the promoted lib.'
          }

          & git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'Promotion working tree changes were not captured in the staged lib diff.'
          }

          $changedFiles = @(& git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0 -or $changedFiles.Count -eq 0) {
            throw 'Unable to inspect the staged promotion diff.'
          }
          $unexpected = @($changedFiles | Where-Object { $_ -notmatch '^lib/' })
          if ($unexpected.Count -ne 0) {
            throw "Promotion diff contains unrelated files: $($unexpected -join ', ')"
          }

          & git diff --cached --check
          if ($LASTEXITCODE -ne 0) {
            throw 'Promotion diff failed git diff --check.'
          }
          . ./.github/scripts/WssPromotion.ps1
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          Assert-WssLib 'lib' "$env:RUNNER_TEMP/wss-release/extracted/WSS-Universal" $approval
          & git diff --cached --stat

          'no_change=false' >> $env:GITHUB_OUTPUT

      - name: Open promotion pull request
        if: >-
          steps.existing.outputs.pr_number == '' &&
          (steps.existing.outputs.branch_exists == 'true' || steps.commit.outputs.no_change == 'false')
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.integration-token.outputs.token }}
          WSS_READ_TOKEN: ${{ steps.evidence-token.outputs.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXISTING_BRANCH: ${{ steps.existing.outputs.branch_exists }}
          BRANCH_NAME: ${{ steps.inputs.outputs.branch }}
          CANDIDATE_ID: ${{ steps.inputs.outputs.candidate_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssPromotion.ps1
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          . ./.github/scripts/WssAutomatic.ps1
          $writeToken = $env:GH_TOKEN
          try {
            $env:GH_TOKEN = $env:WSS_READ_TOKEN
            Assert-WssCandidateNotOlder $approval.candidate '${{ steps.source.outputs.sha }}'
          } finally { $env:GH_TOKEN = $writeToken }
          $bodyPath = Join-Path $env:RUNNER_TEMP 'promotion-pr-body.md'
          @(
            '<!-- wss-promotion:v2 -->'
            (Get-WssApprovalMarker $approval)
            "<!-- correlation-id:$($env:CORRELATION_ID) -->"
            ''
            "Promotes the exact universal candidate from WSSCore run ``$($env:CANDIDATE_ID)``."
            ''
            "- Correlation ID: ``$($env:CORRELATION_ID)``"
            "- Producer: https://github.com/cwru-non-academic/WSSCore/actions/runs/$($approval.candidate.run_id)"
            "- Producer SHA: ``$($approval.candidate.commit)``; artifact: ``$($approval.candidate.artifact_id)``"
            "- Archive: ``$($approval.candidate.archive)``; SHA-256: ``$($approval.candidate.sha256)``"
            "- Integration preflight: https://github.com/cwru-non-academic/CSharp_WSS_Integration_Lib/actions/runs/$($approval.integration.preflight_run_id)"
            "- CLI preflight: https://github.com/cwru-non-academic/CLI_CSharp_WSS_Application/actions/runs/$($approval.cli.preflight_run_id)"
            '- Complete universal content and approval metadata are committed in `lib/`; runnable output uses Ports 8.'
            '- Normal Integration PR CI will validate this committed/local state after the PR opens.'
            ''
            'This workflow does not merge the PR.'
          ) | Set-Content -LiteralPath $bodyPath

          $root=if($env:EXISTING_BRANCH -ceq 'true'){'existing-promotion'}else{'.'}
          $descriptor=@{channel=(Get-WssCiChannel);target_id='csharp-wrapper';repository_root=[IO.Path]::GetFullPath($root);source_sha=$env:SOURCE_SHA;candidate=$approval.candidate;branch=$env:BRANCH_NAME;allowed_paths=@();markers=@('<!-- wss-promotion:v2 -->',(Get-WssApprovalMarker $approval),"<!-- correlation-id:$($env:CORRELATION_ID) -->");gitlinks=@{};parent_heads=@{};precommitted=($env:EXISTING_BRANCH -ceq 'true');body_path=$bodyPath;title="Promote universal WSS run $($env:CANDIDATE_ID)";commit_message="Promote WSS run $env:CANDIDATE_ID`n`nCorrelation-ID: $env:CORRELATION_ID"}
          $descriptorPath=Join-Path $env:RUNNER_TEMP 'publication.json'
          $descriptor|ConvertTo-Json -Depth 12|Set-Content -LiteralPath $descriptorPath
          $env:WSS_PUSH_TOKEN=$writeToken
          $env:GH_TOKEN=$env:WSS_READ_TOKEN
          try {
            Assert-WssCandidateNotOlder $approval.candidate $env:SOURCE_SHA
            & node ./.github/scripts/wss-ci/promotion.mjs $descriptorPath
            if($LASTEXITCODE -ne 0){throw 'Common promotion publication failed or is uncertain; inspect before retry.'}
          } finally {$env:GH_TOKEN=$writeToken; $env:WSS_PUSH_TOKEN=$null}
