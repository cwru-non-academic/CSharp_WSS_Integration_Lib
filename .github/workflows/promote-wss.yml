name: Promote WSS into Integration
run-name: Promote universal WSS / ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      approval_json:
        description: Schema-2 candidate and matching downstream preflight approval JSON
        required: true
        type: string
      correlation_id:
        description: Promotion-cascade correlation ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-wss-dev
  cancel-in-progress: false

jobs:
  promote:
    name: Create WSS promotion PR
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion inputs
        id: inputs
        shell: pwsh
        env:
          APPROVAL_JSON: ${{ inputs.approval_json }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $approval = $env:APPROVAL_JSON | ConvertFrom-Json
          if ([string]$approval.candidate.run_id -cnotmatch '^[1-9][0-9]*$' -or $approval.candidate.sha256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Invalid candidate branch identity.' }
          if ($env:CORRELATION_ID -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$') {
            throw 'correlation_id must be 1-200 branch-safe, single-line characters.'
          }

          "branch=automation/wss-$($approval.candidate.run_id)-$($approval.candidate.sha256)" >> $env:GITHUB_OUTPUT
          "candidate_id=$($approval.candidate.run_id)" >> $env:GITHUB_OUTPUT

      - name: Create WSSCore read token
        id: core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read

      - name: Create preflight evidence read token
        id: evidence-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            CSharp_WSS_Integration_Lib
            CLI_CSharp_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Create Integration write token
        id: integration-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CSharp_WSS_Integration_Lib
          permission-contents: write
          permission-pull-requests: write

      - name: Check out current Integration dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.integration-token.outputs.token }}

      - name: Validate matching preflight approvals
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
          APPROVAL_JSON: ${{ inputs.approval_json }}
        run: |
          . ./.github/scripts/WssPromotion.ps1
          $env:APPROVAL_JSON | Set-Content "$env:RUNNER_TEMP/approval.json"
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          Write-WssApproval $approval "$env:RUNNER_TEMP/approval.json"
          Assert-WssApproval $approval "$env:RUNNER_TEMP/evidence"
          Assert-WssSource '.' $approval.integration.source_sha

      - name: Download, verify, and stage the approved universal candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'wss-release'
          $desiredLib = Join-Path $env:RUNNER_TEMP 'desired-lib'
          . ./.github/scripts/WssPromotion.ps1
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          ./.github/scripts/Resolve-WssRelease.ps1 `
            -ProducerRepository $approval.candidate.repository -RunId $approval.candidate.run_id `
            -ExpectedCommit $approval.candidate.commit -ArchiveName $approval.candidate.archive -ExpectedSha256 $approval.candidate.sha256 `
            -OutputRoot $releaseRoot
          Assert-WssCandidateRecord (Get-Content "$releaseRoot/candidate.json" -Raw | ConvertFrom-Json) $approval
          ./.github/scripts/New-WssLib.ps1 `
            -ArtifactRoot (Join-Path $releaseRoot 'extracted/WSS-Universal') -ApprovalFile "$env:RUNNER_TEMP/approval.json" `
            -Destination $desiredLib

      - name: Inspect existing automation state
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.integration-token.outputs.token }}
          BRANCH_NAME: ${{ steps.inputs.outputs.branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previousNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false

            $pullJson = & gh pr list `
              --repo cwru-non-academic/CSharp_WSS_Integration_Lib `
              --state open `
              --base dev `
              --head $env:BRANCH_NAME `
              --limit 2 `
              --json number,url
            $prListExitCode = $LASTEXITCODE
            if ($prListExitCode -ne 0) {
              throw "Failed to query existing promotion PRs; gh exited with code $prListExitCode."
            }

            $pulls = @($pullJson | ConvertFrom-Json)
            if ($pulls.Count -gt 1) {
              throw "Multiple open promotion PRs use $($env:BRANCH_NAME)."
            }
            $hasExistingPr = $pulls.Count -eq 1
            "Existing promotion PR: $(if ($hasExistingPr) { 'YES' } else { 'NO' })"

            & git ls-remote --exit-code --heads origin "refs/heads/$($env:BRANCH_NAME)" *> $null
            $branchProbeExitCode = $LASTEXITCODE
            $branchExists = switch ($branchProbeExitCode) {
              0 { $true; break }
              2 { $false; break }
              default {
                throw "Failed to inspect the remote automation branch; git ls-remote exited with code $branchProbeExitCode."
              }
            }
            "Automation branch exists: $(if ($branchExists) { 'YES' } else { 'NO' })"

            if ($hasExistingPr -and -not $branchExists) {
              throw 'An open promotion PR exists, but its automation branch is missing.'
            }
          }
          finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativeErrorPreference
          }

          $global:LASTEXITCODE = 0
          if ($hasExistingPr) {
            "pr_number=$($pulls[0].number)" >> $env:GITHUB_OUTPUT
            "pr_url=$($pulls[0].url)" >> $env:GITHUB_OUTPUT
          } else {
            'pr_number=' >> $env:GITHUB_OUTPUT
          }
          "branch_exists=$($branchExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Check out existing automation branch
        if: steps.existing.outputs.branch_exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.branch }}
          path: existing-promotion
          fetch-depth: 0
          token: ${{ steps.integration-token.outputs.token }}

      - name: Validate existing automation branch and PR
        if: steps.existing.outputs.branch_exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.integration-token.outputs.token }}
          PR_NUMBER: ${{ steps.existing.outputs.pr_number }}
          PR_URL: ${{ steps.existing.outputs.pr_url }}
          CANDIDATE_ID: ${{ steps.inputs.outputs.candidate_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssPromotion.ps1
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          if (-not [string]::IsNullOrEmpty($env:PR_NUMBER)) {
            $pr = & gh pr view $env:PR_NUMBER `
              --repo cwru-non-academic/CSharp_WSS_Integration_Lib `
              --json body | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to inspect the existing promotion PR.'
            }

            $requiredMarkers = @(
              '<!-- wss-promotion:v2 -->',
              (Get-WssApprovalMarker $approval),
              "<!-- correlation-id:$($env:CORRELATION_ID) -->"
            )
            foreach ($marker in $requiredMarkers) {
              if (-not $pr.body.Contains($marker, [StringComparison]::Ordinal)) {
                throw "Existing promotion PR has mismatched metadata: $marker"
              }
            }
            $existingApproval = Read-WssApprovalMarker $pr.body "$env:RUNNER_TEMP/existing-approval.json"
            if ((Get-WssApprovalMarker $existingApproval) -cne (Get-WssApprovalMarker $approval) -or
                [Regex]::Matches($pr.body, '<!-- wss-promotion:v2 -->').Count -ne 1 -or
                [Regex]::Matches($pr.body, '(?m)^<!-- correlation-id:').Count -ne 1) { throw 'Existing PR has ambiguous or mismatched promotion metadata.' }

            $pages = Invoke-WssGh @('api', '--paginate', '--slurp', "repos/cwru-non-academic/CSharp_WSS_Integration_Lib/pulls/$($env:PR_NUMBER)/files?per_page=100") | ConvertFrom-Json
            $files = @($pages | ForEach-Object { $_ })
            if ($files.Count -eq 0) {
              throw 'Existing promotion PR has no readable changed files.'
            }
            $unexpected = @($files | Where-Object { $_.filename -notmatch '^lib/' })
            if ($unexpected.Count -ne 0) {
              throw "Existing promotion PR changes files outside lib/: $($unexpected.filename -join ', ')"
            }
          }

          & git diff --no-index --quiet -- `
            (Join-Path $env:RUNNER_TEMP 'desired-lib') `
            'existing-promotion/lib'
          if ($LASTEXITCODE -ne 0) {
            throw 'Existing promotion PR does not contain the intended lib state.'
          }

          $branchFiles = @(& git -C existing-promotion diff --name-only origin/dev...HEAD)
          if ($LASTEXITCODE -ne 0 -or $branchFiles.Count -eq 0) {
            throw 'Existing automation branch has no readable diff from dev.'
          }
          $unexpectedBranchFiles = @($branchFiles | Where-Object { $_ -notmatch '^lib/' })
          if ($unexpectedBranchFiles.Count -ne 0) {
            throw "Existing automation branch changes files outside lib/: $($unexpectedBranchFiles -join ', ')"
          }

          Assert-WssSource 'existing-promotion' $approval.integration.source_sha
          $commitMessage = & git -C existing-promotion log -1 --format=%B
          if ($LASTEXITCODE -ne 0 -or
              $commitMessage -notcontains "Promote WSS run $($env:CANDIDATE_ID)" -or
              $commitMessage -notcontains "Correlation-ID: $($env:CORRELATION_ID)") {
            throw 'Existing automation branch has mismatched deterministic commit metadata.'
          }

          if ([string]::IsNullOrEmpty($env:PR_NUMBER)) {
            'Validated an interrupted promotion branch; the missing PR will be created.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Reusing matching promotion PR: $($env:PR_URL)" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Replace artifact-managed lib contents
        if: steps.existing.outputs.branch_exists == 'false'
        shell: pwsh
        env:
          BRANCH_NAME: ${{ steps.inputs.outputs.branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          & git switch -c $env:BRANCH_NAME
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create the local automation branch.'
          }

          Remove-Item -LiteralPath 'lib' -Recurse -Force
          New-Item -ItemType Directory -Path 'lib' | Out-Null
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'desired-lib/*') -Destination 'lib' -Recurse

      - name: Validate and commit the lib-only diff
        if: steps.existing.outputs.branch_exists == 'false'
        id: commit
        shell: pwsh
        env:
          CANDIDATE_ID: ${{ steps.inputs.outputs.candidate_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workingTreeChanges = @(& git status --short --untracked-files=all)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect the promotion working tree.'
          }
          if ($workingTreeChanges.Count -eq 0) {
            'no_change=true' >> $env:GITHUB_OUTPUT
            'Integration dev already contains the intended promoted lib state.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $unexpectedWorkingTreeChanges = @($workingTreeChanges | Where-Object {
            $_.Length -lt 4 -or $_.Substring(3).Trim('"') -notmatch '^lib/'
          })
          if ($unexpectedWorkingTreeChanges.Count -ne 0) {
            throw "Promotion changed files outside lib/: $($unexpectedWorkingTreeChanges -join ', ')"
          }

          & git add -A -- lib
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to stage the promoted lib.'
          }

          & git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'Promotion working tree changes were not captured in the staged lib diff.'
          }

          $changedFiles = @(& git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0 -or $changedFiles.Count -eq 0) {
            throw 'Unable to inspect the staged promotion diff.'
          }
          $unexpected = @($changedFiles | Where-Object { $_ -notmatch '^lib/' })
          if ($unexpected.Count -ne 0) {
            throw "Promotion diff contains unrelated files: $($unexpected -join ', ')"
          }

          & git diff --cached --check
          if ($LASTEXITCODE -ne 0) {
            throw 'Promotion diff failed git diff --check.'
          }
          . ./.github/scripts/WssPromotion.ps1
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          Assert-WssLib 'lib' "$env:RUNNER_TEMP/wss-release/extracted/WSS-Universal" $approval
          & git diff --cached --stat

          & git config user.name 'wss-promotion[bot]'
          & git config user.email 'wss-promotion[bot]@users.noreply.github.com'
          & git commit `
            -m "Promote WSS run $env:CANDIDATE_ID" `
            -m "Correlation-ID: $env:CORRELATION_ID"
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to commit the promoted lib.'
          }
          'no_change=false' >> $env:GITHUB_OUTPUT

      - name: Push automation branch
        if: steps.existing.outputs.branch_exists == 'false' && steps.commit.outputs.no_change == 'false'
        shell: pwsh
        env:
          BRANCH_NAME: ${{ steps.inputs.outputs.branch }}
        run: |
          & git push origin "HEAD:refs/heads/$($env:BRANCH_NAME)"
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to push the automation branch without force.'
          }

      - name: Open promotion pull request
        if: >-
          steps.existing.outputs.pr_number == '' &&
          (steps.existing.outputs.branch_exists == 'true' || steps.commit.outputs.no_change == 'false')
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.integration-token.outputs.token }}
          BRANCH_NAME: ${{ steps.inputs.outputs.branch }}
          CANDIDATE_ID: ${{ steps.inputs.outputs.candidate_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/WssPromotion.ps1
          $approval = Read-WssApproval "$env:RUNNER_TEMP/approval.json"
          $bodyPath = Join-Path $env:RUNNER_TEMP 'promotion-pr-body.md'
          @(
            '<!-- wss-promotion:v2 -->'
            (Get-WssApprovalMarker $approval)
            "<!-- correlation-id:$($env:CORRELATION_ID) -->"
            ''
            "Promotes the exact universal candidate from WSSCore run ``$($env:CANDIDATE_ID)``."
            ''
            "- Correlation ID: ``$($env:CORRELATION_ID)``"
            "- Producer: https://github.com/cwru-non-academic/WSSCore/actions/runs/$($approval.candidate.run_id)"
            "- Producer SHA: ``$($approval.candidate.commit)``; artifact: ``$($approval.candidate.artifact_id)``"
            "- Archive: ``$($approval.candidate.archive)``; SHA-256: ``$($approval.candidate.sha256)``"
            "- Integration preflight: https://github.com/cwru-non-academic/CSharp_WSS_Integration_Lib/actions/runs/$($approval.integration.preflight_run_id)"
            "- CLI preflight: https://github.com/cwru-non-academic/CLI_CSharp_WSS_Application/actions/runs/$($approval.cli.preflight_run_id)"
            '- Complete universal content and approval metadata are committed in `lib/`; runnable output uses Ports 8.'
            '- Normal Integration PR CI will validate this committed/local state after the PR opens.'
            ''
            'This workflow does not merge the PR.'
          ) | Set-Content -LiteralPath $bodyPath

          $url = & gh pr create `
            --repo cwru-non-academic/CSharp_WSS_Integration_Lib `
            --base dev `
            --head $env:BRANCH_NAME `
            --title "Promote universal WSS run $($env:CANDIDATE_ID)" `
            --body-file $bodyPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create the Integration promotion PR.'
          }
          "Created promotion PR: $url" >> $env:GITHUB_STEP_SUMMARY
