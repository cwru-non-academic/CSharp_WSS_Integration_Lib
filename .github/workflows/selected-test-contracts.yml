name: Selected test source contracts
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    name: Selected test source contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject malformed, mutable and coupled selected sources
        shell: pwsh
        run: ./.github/scripts/tests/CSharpTestSource.Tests.ps1
