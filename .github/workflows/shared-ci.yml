name: Shared CI implementation
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  identical:
    name: Shared CI source identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read exact canonical source revision
        id: lock
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const l=JSON.parse(fs.readFileSync(".github/scripts/wss-ci.lock.json","utf8"));
            if(l.source_repository!=="cwru-non-academic/WSSCore" || !/^[a-f0-9]{40}$/.test(l.source_commit) || l.source_ref!==`refs/heads/ci/tooling/${l.source_commit}`) throw Error("Invalid shared CI source");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`commit=${l.source_commit}\n`);
            const i=l.origins?.integration;
            if(l.schema!=="wss-shared-ci/v2" || i?.repository!=="cwru-non-academic/Python_WSS_Integration_Lib" || !/^[a-f0-9]{40}$/.test(i.commit) || i.ref!==`refs/heads/ci/tooling/${i.commit}` || i.workspace!=="Python_WSS_Integration_Lib") throw Error("Invalid integration CI source");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`integration_commit=${i.commit}\n`);
          '
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.lock.outputs.commit }}
          path: .wss-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ steps.lock.outputs.integration_commit }}
          path: .wss-core/.ci-origins/Python_WSS_Integration_Lib
          persist-credentials: false
      - name: Reject common implementation drift
        env:
          TARGET_REPOSITORY: ${{ github.event.repository.name }}
        run: node .wss-core/tools/ci/sync-tooling.mjs check "$TARGET_REPOSITORY" "$GITHUB_WORKSPACE"
      - name: Reject stale executable integration pins
        env:
          TARGET_REPOSITORY: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ github.token }}
        run: node .wss-core/tools/ci/adapter-pins.mjs check "$TARGET_REPOSITORY" "$GITHUB_WORKSPACE"
      - name: Test actual CSharp application sender adapter
        if: ${{ github.event.repository.name == 'CSharp_WSS_Integration_Lib' }}
        shell: pwsh
        run: ./.wss-core/.ci-origins/Python_WSS_Integration_Lib/.github/scripts/wss-ci/tests/ApplicationDispatch.Tests.ps1 -CSharpSenderPath ./.github/scripts/WssFanout.ps1
      - name: Test actual Unity application sender adapter
        if: ${{ github.event.repository.name == 'Unity_WSS_Integration_Lib' }}
        shell: pwsh
        run: ./.wss-core/.ci-origins/Python_WSS_Integration_Lib/.github/scripts/wss-ci/tests/ApplicationDispatch.Tests.ps1 -UnitySenderPath ./.github/scripts/UnityPromotion.ps1
      - name: Protect committed CI from unrelated concurrency requests
        if: ${{ github.event.repository.name == 'Unity_WSS_Integration_Lib' || github.event.repository.name == 'GUI_Unity_WSS_Application' || github.event.repository.name == 'ROS_Python_WSS_Application' }}
        env:
          WSS_CONCURRENCY_TARGET_ROOT: ${{ github.workspace }}
        run: node --test .wss-core/tools/ci/unity-concurrency.test.mjs
